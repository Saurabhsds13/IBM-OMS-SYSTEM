spring.application.name=IBM-OMS-SYSTEM
server.port=8081

# --- Database (externalized; no hardcoded secrets) ---
# Values are supplied by the Configuration_Provider via environment variables.
# Startup fails fast if a required value is absent (Requirement 10.1, 10.4).
spring.datasource.url=${OMS_DB_URL}
spring.datasource.username=${OMS_DB_USERNAME}
spring.datasource.password=${OMS_DB_PASSWORD}

# --- JPA / Hibernate ---
# Hibernate must not alter the schema at runtime; Flyway owns the schema
# (Requirement 9.1).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Flyway versioned migrations (Requirement 9) ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
# Placeholders consumed by the bootstrap-admin seed migration (Requirement 7.1, 7.2).
# The password hash is a BCrypt hash sourced from the Configuration_Provider; no
# plaintext secret lives in source control.
spring.flyway.placeholders.bootstrapAdminUsername=${OMS_BOOTSTRAP_ADMIN_USERNAME:admin}
spring.flyway.placeholders.bootstrapAdminPasswordHash=${OMS_BOOTSTRAP_ADMIN_PASSWORD_HASH}

# --- CORS (admin UI origins) ---
# Comma-separated allowed browser origins for the admin dashboard. Defaults to
# the Vite dev server; override per environment.
oms.security.cors.allowed-origins=${OMS_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- JWT signing secret (externalized; Requirement 10.2, 10.3) ---
oms.security.jwt.secret=${OMS_JWT_SECRET}
oms.security.jwt.access-token-expiration-ms=900000
oms.security.jwt.refresh-token-expiration-ms=604800000
