# Local infrastructure for running the OMS stack end-to-end.
#
#   docker compose up -d
#
# Brings up:
#   - MySQL 8      on localhost:3306  (database: omsdb)
#   - Kafka (KRaft) on localhost:9092  (single broker, no Zookeeper)
#
# The OMS backend and QuickBasket connect to these using the env vars documented
# in Docs/TECHNICAL.md and each app's .env.example. This file provisions
# infrastructure only; the Spring Boot apps and the React UIs are run separately
# (see Docs/RUN.md).

services:
  mysql:
    image: mysql:8.0
    container_name: oms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: omsdb
      MYSQL_USER: oms
      MYSQL_PASSWORD: omspass
    ports:
      - "3306:3306"
    volumes:
      - oms-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    container_name: oms-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # --- KRaft (no Zookeeper) ---
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # --- Listeners ---
      # INTERNAL for in-container clients, EXTERNAL for host apps on localhost:9092.
      KAFKA_CFG_LISTENERS: "INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      # --- Single-node friendly settings ---
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - oms-kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # Optional: a small web UI to inspect Kafka topics/messages during testing.
  # Visit http://localhost:8085 . Remove if you don't want it.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: oms-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  oms-mysql-data:
  oms-kafka-data:
